name: eudamed-mobile
options:
  bundleIdPrefix: li.kausch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  eudamed-public:
    url: https://github.com/tkausch/eudamed-public
    from: 0.1.1

targets:
  eudamed-mobile-iOS:
    type: application
    platform: iOS
    productName: eudamed-mobile
    deploymentTarget: "17.0"
    sources:
      - path: eudamed-mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: li.kausch.eudamed-mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"eudamed-mobile/Preview Content\""
        ENABLE_PREVIEWS: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: eudamed-public
        product: EudamedClient
      - package: eudamed-public
        product: EudamedCore

schemes:
  eudamed-mobile-iOS:
    build:
      targets:
        eudamed-mobile-iOS: all
    run:
      config: Debug
    archive:
      config: Release
